[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calculadora3d"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
calculadora3d = "calculadora3d.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = {attr = "calculadora3d.__version__"}

[tool.setuptools.packages.find]
include = ["calculadora3d*"]

[tool.setuptools.package-data]
calculadora3d = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
