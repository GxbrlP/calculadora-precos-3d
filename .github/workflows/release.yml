# Gera o .exe (Windows) e o AppImage (Linux).
# - push de tag vX.Y.Z: testa, gera os dois e publica a release da tag.
# - "Run workflow" na aba Actions: testa e gera os dois (ficam como artefatos
#   do run), sem publicar release. Serve para testar o processo.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Bibliotecas de sistema que o Qt (PySide6) precisa no Linux.
  QT_APT_DEPS: >-
    libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
    libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0
    libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-xfixes0
    libdbus-1-3 libfontconfig1

jobs:
  test:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Bibliotecas do Qt
        run: sudo apt-get update && sudo apt-get install -y $QT_APT_DEPS
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Testes
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Versão
        id: version
        run: echo "version=$(python -c 'import calculadora3d; print(calculadora3d.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Tag bate com a versão
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/check_version.py "$GITHUB_REF_NAME"

  windows:
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: PyInstaller
        run: pyinstaller calculadora3d.spec --noconfirm --clean
      - name: Conferir recursos empacotados
        shell: pwsh
        run: |
          $list = pyi-archive_viewer -l -b dist/Calculadora3D.exe | Out-String
          if ($list -notmatch 'calculadora3d.resources.icon\.png') {
            throw "icon.png não foi empacotado no .exe"
          }
      - name: Renomear
        shell: pwsh
        run: Move-Item dist/Calculadora3D.exe "dist/Calculadora3D-$env:VERSION-windows.exe"
      - name: Teste de fumaça (15 s)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "appdata"
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:APPDATA = $data
          $p = Start-Process "dist/Calculadora3D-$env:VERSION-windows.exe" -PassThru
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if ($alive) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $alive) { throw "o app fechou antes do tempo (código $($p.ExitCode))" }
          if (-not (Test-Path (Join-Path $data "Calculadora3D/dados.db"))) {
            throw "o app abriu mas não criou o banco de dados"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Calculadora3D-${{ env.VERSION }}-windows.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Bibliotecas do Qt e xvfb
        run: sudo apt-get update && sudo apt-get install -y $QT_APT_DEPS xvfb
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: AppImage
        run: bash packaging/linux/build_appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Calculadora3D-${{ env.VERSION }}-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [test, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Calculadora 3D ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Calculadora3D-${{ env.VERSION }}-windows.exe
            dist/Calculadora3D-${{ env.VERSION }}-x86_64.AppImage
